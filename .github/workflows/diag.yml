name: diag
run-name: diag-${{ inputs.request_id }}

# One-off diagnostic: can a real headless browser on a GitHub runner get past a site's
# Cloudflare protection? If yes, a browser-based solver (e.g. FlareSolverr) would fix
# it; if even a real browser gets blocked, it's an IP/datacenter ban that only a proxy
# can solve. Not part of the download flow.
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe with a real headless browser
        env:
          TARGET_URL: ${{ inputs.url }}
        run: |
          python -m pip install --quiet --upgrade playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright

          url = os.environ["TARGET_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(
                  user_agent=("Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                              "AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36")
              )
              resp = page.goto(url, wait_until="domcontentloaded", timeout=60000)
              status = resp.status if resp else "no response"
              print(f"HTTP status: {status}")
              # let any Cloudflare interstitial run its JS
              page.wait_for_timeout(8000)
              title = page.title()
              body = page.content()
              print(f"page title: {title!r}")
              markers = {
                  "just a moment (cloudflare)": "just a moment" in body.lower(),
                  "checking your browser": "checking your browser" in body.lower(),
                  "attention required": "attention required" in body.lower(),
                  "has <video> tag": "<video" in body.lower(),
                  "has .mp4 in html": ".mp4" in body.lower(),
                  "body length": len(body),
              }
              for k, v in markers.items():
                  print(f"  {k}: {v}")
              browser.close()
          PY
