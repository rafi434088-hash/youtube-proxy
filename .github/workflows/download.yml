name: download
run-name: dl-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique download id (used for run-name + artifact name)'
        required: true
        type: string
      url:
        description: 'Video / page URL'
        required: true
        type: string
      quality:
        description: 'best | 1080 | 720 | 480 | audio'
        required: false
        default: 'best'
        type: string
      mode:
        description: 'video (single item) | collection (whole channel/playlist, zipped)'
        required: false
        default: 'video'
        type: string
      cookies_enc:
        description: 'AES-256-GCM encrypted cookies.txt, base64 (iv|ct|tag). Leave empty for none.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dl-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      # yt-dlp needs a JS runtime (Deno) plus the actual challenge-solver script to
      # pass YouTube's "n" parameter check. Deno alone isn't enough — without also
      # passing --remote-components ejs:github (below, on the real yt-dlp calls),
      # yt-dlp skips the solver and every video fails with "The page needs to be
      # reloaded", found live: https://github.com/yt-dlp/yt-dlp/wiki/EJS
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade yt-dlp cryptography
          NEED_APT=0
          command -v ffmpeg >/dev/null 2>&1 || NEED_APT=1
          command -v zip >/dev/null 2>&1 || NEED_APT=1
          if [ "$NEED_APT" = "1" ]; then sudo apt-get update -qq; fi
          command -v ffmpeg >/dev/null 2>&1 || sudo apt-get install -y -qq ffmpeg
          command -v zip >/dev/null 2>&1 || sudo apt-get install -y -qq zip
          yt-dlp --version
          ffmpeg -version | head -1

      - name: Decrypt cookies
        if: ${{ inputs.cookies_enc != '' }}
        env:
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          if [ -z "$COOKIE_KEY" ]; then
            echo "::error::repository secret COOKIE_KEY is missing"
            exit 1
          fi
          python - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob = base64.b64decode(os.environ["COOKIES_ENC"])
          key = bytes.fromhex(os.environ["COOKIE_KEY"].strip())
          iv, ct = blob[:12], blob[12:]
          try:
              data = AESGCM(key).decrypt(iv, ct, None)
          except Exception:
              print("::error::cookie decryption failed - COOKIE_KEY in the extension and in the repo secret do not match")
              sys.exit(1)
          with open("cookies.txt", "wb") as f:
              f.write(data)
          print(f"cookies.txt written ({len(data)} bytes)")
          PY

      - name: Download
        env:
          TARGET_URL: ${{ inputs.url }}
          QUALITY: ${{ inputs.quality }}
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p out work
          case "$QUALITY" in
            audio) FMT_ARGS="-f bestaudio/best -x --audio-format mp3 --audio-quality 0" ;;
            1080)  FMT_ARGS="-f bv*[height<=1080]+ba/b[height<=1080]/bv*+ba/b --merge-output-format mp4" ;;
            720)   FMT_ARGS="-f bv*[height<=720]+ba/b[height<=720]/bv*+ba/b --merge-output-format mp4" ;;
            480)   FMT_ARGS="-f bv*[height<=480]+ba/b[height<=480]/bv*+ba/b --merge-output-format mp4" ;;
            *)     FMT_ARGS="-f bv*+ba/b --merge-output-format mp4" ;;
          esac

          COOKIE_ARGS=""
          if [ -f cookies.txt ]; then COOKIE_ARGS="--cookies cookies.txt"; fi

          if [ "$MODE" = "collection" ]; then
            # Whole channel/playlist: name the zip after it (fall back to "collection"
            # when yt-dlp can't resolve a name), download every item, then bundle
            # everything into that one zip so exactly one file lands in Downloads.
            NAME=$(yt-dlp --flat-playlist --print "%(playlist_title,channel,uploader)s" \
              --playlist-items 1 $COOKIE_ARGS -- "$TARGET_URL" 2>/dev/null | head -1)
            # yt-dlp prints the literal string "NA" for a field it can't resolve
            # (e.g. a direct file URL with no playlist/channel/uploader at all) —
            # that's not an empty string, so it needs its own check.
            if [ -z "$NAME" ] || [ "$NAME" = "NA" ]; then NAME="collection"; fi
            SAFE_NAME=$(printf '%s' "$NAME" | tr -s ' /\\:*?"<>|' '_' | cut -c1-120)
            [ -z "$SAFE_NAME" ] && SAFE_NAME="collection"
            echo "collection name: $SAFE_NAME"

            yt-dlp \
              $FMT_ARGS \
              $COOKIE_ARGS \
              --no-progress \
              --newline \
              --retries 5 \
              --fragment-retries 10 \
              --embed-metadata \
              --ignore-errors \
              --remote-components ejs:github \
              -o "work/%(title).100B [%(id)s].%(ext)s" \
              -- "$TARGET_URL"

            if [ -z "$(ls -A work 2>/dev/null)" ]; then
              echo "::error::no files were downloaded for this collection"
              exit 1
            fi
            (cd work && zip -r -q "../out/${SAFE_NAME}.zip" .)
          else
            yt-dlp \
              $FMT_ARGS \
              $COOKIE_ARGS \
              --no-playlist \
              --no-progress \
              --newline \
              --retries 5 \
              --fragment-retries 10 \
              --embed-metadata \
              --remote-components ejs:github \
              -o "out/%(title).120B [%(id)s].%(ext)s" \
              -- "$TARGET_URL"
          fi

          rm -f cookies.txt
          ls -la out

      - name: Always drop cookies
        if: always()
        run: rm -f cookies.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dl-${{ inputs.request_id }}
          path: out/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
